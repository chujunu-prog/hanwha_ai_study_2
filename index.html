<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10162b" />
    <title>코트사이드 슛</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div class="brand"><span class="ball-mark">●</span><span>HANWHA</span><strong>SHOOOOOT</strong></div>
        <div class="scoreboard" aria-label="게임 점수">
          <div><small>SCORE</small><b id="score">000</b></div>
          <i></i>
          <div><small>STREAK</small><b id="streak">× 0</b></div>
        </div>
      </header>

      <section class="arena" aria-label="농구 슛 게임">
        <canvas id="court" width="1100" height="620" aria-label="농구 코트"></canvas>
        <div class="shot-message" id="shotMessage" aria-live="polite">READY?</div>
        <div class="rim-label">3 POINT LINE</div>
      </section>

      <section class="controls">
        <div class="control-card aim-card">
          <div class="card-kicker">DIRECTION</div>
          <div class="aim-display"><span class="compass">↗</span><span id="angle">52°</span></div>
          <p>← → 로 0°–90° 조절</p>
        </div>
        <div class="control-card power-card">
          <div class="card-kicker">SHOT POWER</div>
          <div class="power-track" aria-label="슛 파워"><span id="powerFill"></span><em id="powerText">HOLD SPACE</em></div>
          <p>스페이스바를 길게 눌러 힘을 모으세요</p>
        </div>
        <div class="control-card tip-card">
          <div class="card-kicker">HOW TO PLAY</div>
          <p><kbd>←</kbd><kbd>→</kbd> 방향 조절</p>
          <p><kbd>SPACE</kbd> 홀드 후 놓기</p>
        </div>
      </section>
      <p class="footer-note">PERFECT RELEASE · 초록 영역에서 놓으면 더 정확해집니다</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
